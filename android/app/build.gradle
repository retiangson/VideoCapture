plugins { id 'com.android.application' }
android {
    namespace 'com.retiangson.videocapture'
    compileSdk 36
    defaultConfig {
        applicationId 'com.retiangson.videocapture'
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName '0.3.1'
        resValue 'string','app_name','VideoCapture'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild { cmake { arguments '-DGGML_OPENMP=OFF', '-DGGML_NATIVE=OFF', '-DWHISPER_BUILD_TESTS=OFF', '-DWHISPER_BUILD_EXAMPLES=OFF', '-DWHISPER_BUILD_SERVER=OFF', '-DBUILD_SHARED_LIBS=OFF'; cppFlags '-std=c++17' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        preview { initWith release; signingConfig signingConfigs.debug; applicationIdSuffix '.preview'; matchingFallbacks=['release']; resValue 'string','app_name','VideoCapture Preview' }
    }
    androidResources { noCompress += ['bin'] }
    packaging { jniLibs { useLegacyPackaging false }; resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] } }
    sourceSets { main { assets.srcDirs += ['../../src/VideoCapture/Models'] } }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.herohan:UVCAndroid:1.0.13'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
